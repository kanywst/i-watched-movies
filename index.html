<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Set the theme before first paint to avoid a flash of the wrong palette.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="https://github.com/kanywst.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Movies kanywst Watched</title>
    <meta name="description" content="A personal archive of movies kanywst has watched, with scores and impressions." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Movies kanywst Watched" />
    <meta property="og:description" content="A personal archive of movies kanywst has watched, with scores and impressions." />
    <meta property="og:image" content="https://github.com/kanywst.png" />
    <meta property="og:url" content="https://i-watched-movies.edgebox12.workers.dev/" />
    <link rel="canonical" href="https://i-watched-movies.edgebox12.workers.dev/" />
    <meta property="og:site_name" content="The Movies kanywst Watched" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="The Movies kanywst Watched" />
    <meta name="twitter:description" content="A personal archive of movies kanywst has watched, with scores and impressions." />
    <meta name="twitter:image" content="https://github.com/kanywst.png" />

    <link rel="alternate" type="application/rss+xml" title="The Movies kanywst Watched" href="./feed.xml" />
    <!-- No webfont on purpose. Inter used to be pulled from Google Fonts here, but nothing
         ever set font-family to it: Tailwind's default --font-sans is the system stack, so
         every Inter face stayed `unloaded`, document.fonts.check('16px Inter') was false and
         fonts.gstatic.com was never even hit. All it did was put a render-blocking
         cross-origin stylesheet in front of the first paint. To actually use Inter, set
         --font-sans in the @theme block in src/index.css and add the link back. -->
    <!-- Every poster in the grid comes from here, so pay the DNS + TLS handshake in
         parallel with the JS rather than when the first card mounts. -->
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin>
  </head>
  <body class="bg-stone-50 text-stone-900 dark:bg-dark-bg dark:text-dark-text min-h-screen selection:bg-stone-300/60 dark:selection:bg-purple-500/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
