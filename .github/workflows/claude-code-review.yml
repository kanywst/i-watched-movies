name: Claude code review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

# A rapid re-push should supersede the in-flight review rather than post twice.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Dependabot bumps and the issue-to-movie bot both open PRs that are content or
    # lockfile only, and the movie bot squash-merges its own PR inside the same job, so
    # reviewing either just burns tokens on something nobody reads.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !startsWith(github.event.pull_request.head.ref, 'bot/movie/')
    steps:
      # Keeps the job green (and silent) until the token is added to the repo secrets,
      # instead of turning every PR red with an auth failure.
      - name: Check for a token
        id: key
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: echo "present=${CLAUDE_CODE_OAUTH_TOKEN:+true}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 1

      # Advisory, not a gate. A reviewer that cannot finish (expired token, empty credit
      # balance, provider outage, or the agent itself returning is_error) says nothing
      # about the change under review, so it must not be what blocks a merge.
      #
      # This has to sit on the step, not on the job. `continue-on-error` at job level only
      # stops the *workflow run* from failing; the job's own check run still reports a
      # failure, which is what put a red "Claude code review / review — Failing" on PR #638
      # after a transient is_error with no comments posted. On the step, the job itself
      # concludes successfully and the failure shows up as an annotation instead.
      #
      # Deliberately not retried. The one failure seen so far cleared on a manual re-run,
      # but an automatic second attempt would double the cost of the common hard failure
      # (no credit), and a first attempt that dies *after* posting some inline comments
      # would duplicate them. Re-run the job by hand when a review is missing.
      - uses: anthropics/claude-code-action@v1
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        with:
          # `claude setup-token` issues an OAuth token (sk-ant-oat01-...) that runs on the
          # Claude subscription. It is not an API key and is rejected by the x-api-key
          # header, so it has to go through this input rather than anthropic_api_key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out in the working
            directory.

            This is a personal film diary: markdown in movies/ with YAML frontmatter,
            built by scripts/generate-movies.js into src/data/movies.json, public/feed.xml
            and public/collection.jsonld (all three gitignored), then rendered by a React +
            Vite SPA and deployed to Cloudflare Workers.

            Focus on:
            - Correctness and edge cases, especially anything reading watch_date or
              release_date. Watchlist entries legitimately have an empty watch_date, and
              published/seen is a tri-state: rated (published, not seen), watched but
              unrated (seen), and not yet watched (neither).
            - Whether a frontmatter change was made in every place that needs it.
              scripts/parse-movie.js, src/types.ts and scripts/build-movie-from-issue.js
              have to agree on the shape.
            - Consistency with the surrounding code: tunables belong in src/constants.ts
              rather than inlined, and pure logic is unit tested while components are not.
            - Security and performance implications of the change.

            Report only what you can point at in the diff. Do not restate what the change
            does, do not praise it, and skip nits that a linter would already catch. If the
            change looks sound, say so in one line rather than inventing findings.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
            to point at specific lines.
            Only post GitHub comments, do not return the review as a message.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
