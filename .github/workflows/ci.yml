name: CI

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint Markdown
        run: npm run lint:md

      - name: Test
        run: npm test

      # Runs the same command as the local `npm run check` gate so the two cannot drift.
      # Scoped to production dependencies: the remaining high advisories are all in
      # build-time-only packages (js-yaml via gray-matter, which pins js-yaml 3.x and has
      # no patched release on that line), and none of them parse untrusted input. Anything
      # that ships in the bundle still fails the build.
      - name: Security Audit
        run: npm run audit

      - name: Build
        run: npm run build
