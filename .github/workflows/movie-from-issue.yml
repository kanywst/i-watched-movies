name: Movie from issue

on:
  issues:
    types: [opened, edited, labeled, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write
  # To dispatch verify-deploy.yml after the merge.
  actions: write

jobs:
  build:
    # An issue filed with its labels fires `opened` plus one `labeled` per label, four runs
    # for one issue. Only the `type: movie` label can change whether this job applies, so
    # the other `labeled` events are dropped here. That still leaves two (opened, and
    # labeled with type: movie), which the "already on main" check below makes harmless.
    if: >-
      github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name, 'type: movie') &&
      github.event.issue.state == 'open' &&
      (github.event.action != 'labeled' || github.event.label.name == 'type: movie')
    runs-on: ubuntu-latest
    concurrency:
      group: movie-from-issue-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark issue as processing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE" \
            --remove-label 'status: queued' \
            --remove-label 'status: failed' \
            --remove-label 'status: pr-opened' \
            --remove-label 'status: merged' \
            --add-label 'status: processing' || true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build movie file from issue
        id: build
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/build-movie-from-issue.js

      - name: Check for changes
        id: changes
        env:
          PATH_FILE: ${{ steps.build.outputs.path }}
        run: |
          if [ -n "$(git status --porcelain -- "$PATH_FILE")" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to $PATH_FILE"
          fi

      - name: Acknowledge no-op
        if: steps.changes.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE" --remove-label 'status: processing' || true
          gh issue comment "$ISSUE" --body "No changes detected; the existing file already matches this issue."

      - name: Validate (lint + test + build)
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm run lint
          npm test
          npm run build

      # cancel-in-progress does not stop a run that is already past its checkout, so two runs
      # for one issue can both build from a main that predates the other's merge. On
      # 2026-09-23 the loser opened a second PR adding the same file with a different
      # `added` stamp, failed five merge attempts, and marked an issue failed whose entry
      # had already landed. Re-read main right before committing and stand down if it
      # already carries this content. `added` is ignored in the comparison because each run
      # stamps its own; the one already on main is the one to keep.
      - name: Check whether main already has this entry
        if: steps.changes.outputs.changed == 'true'
        id: landed
        env:
          PATH_FILE: ${{ steps.build.outputs.path }}
        run: |
          git fetch --quiet origin main
          if git cat-file -e "origin/main:$PATH_FILE" 2>/dev/null; then
            git show "origin/main:$PATH_FILE" | grep -v '^added:' > "$RUNNER_TEMP/on-main.md"
            grep -v '^added:' "$PATH_FILE" > "$RUNNER_TEMP/built.md"
          fi
          if [ -f "$RUNNER_TEMP/on-main.md" ] && cmp -s "$RUNNER_TEMP/on-main.md" "$RUNNER_TEMP/built.md"; then
            echo "landed=true" >> "$GITHUB_OUTPUT"
            echo "main already carries $PATH_FILE with this content."
          else
            echo "landed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Acknowledge entry already on main
        if: steps.landed.outputs.landed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE" \
            --remove-label 'status: processing' \
            --remove-label 'status: pr-opened' \
            --add-label 'status: merged' || true
          gh issue close "$ISSUE" --reason completed || true

      - name: Configure git
        if: steps.changes.outputs.changed == 'true' && steps.landed.outputs.landed != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Commit and push branch
        if: steps.changes.outputs.changed == 'true' && steps.landed.outputs.landed != 'true'
        id: commit
        env:
          SLUG: ${{ steps.build.outputs.slug }}
          TITLE: ${{ steps.build.outputs.title }}
          PATH_FILE: ${{ steps.build.outputs.path }}
          ACTION: ${{ steps.build.outputs.action }}
        run: |
          BRANCH="bot/movie/$SLUG"
          if [ "$ACTION" = "update" ]; then
            VERB="update"
          else
            VERB="add"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "verb=$VERB" >> "$GITHUB_OUTPUT"
          git checkout -B "$BRANCH"
          git add "$PATH_FILE"
          git commit -m "feat(movies): $VERB $TITLE"
          git push --force-with-lease origin "$BRANCH"

      - name: Open or update PR and merge
        if: steps.changes.outputs.changed == 'true' && steps.landed.outputs.landed != 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          VERB: ${{ steps.commit.outputs.verb }}
          TITLE: ${{ steps.build.outputs.title }}
          LIST: ${{ steps.build.outputs.list }}
          PATH_FILE: ${{ steps.build.outputs.path }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          BODY=$(cat <<EOF
          Closes #${ISSUE}

          Generated by **movie-from-issue** from issue #${ISSUE}.

          - Title: ${TITLE}
          - List: ${LIST}
          - File: \`${PATH_FILE}\`
          EOF
          )
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$EXISTING" ]; then
            URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "feat(movies): $VERB $TITLE" \
              --body "$BODY" \
              --label bot)
            NUMBER=$(basename "$URL")
          else
            NUMBER="$EXISTING"
            URL=$(gh pr view "$EXISTING" --json url -q .url)
            gh pr edit "$EXISTING" \
              --title "feat(movies): $VERB $TITLE" \
              --body "$BODY"
          fi
          # Validation (lint+test+build) already ran in-job, so merge directly.
          # main is unprotected; auto-merge can't be used because a GITHUB_TOKEN
          # merge would not trigger a follow-up workflow run to close the issue.
          #
          # Several issues can be in flight at once (each has its own concurrency
          # group), and whichever run merges first moves main under the others, so
          # the loser gets "Base branch was modified". That is transient: GitHub
          # only needs to recompute mergeability against the new base. Retry with
          # backoff instead of failing the issue.
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$NUMBER" --squash --delete-branch; then
              MERGED=1
              break
            fi
            echo "Merge attempt $attempt failed; base branch likely moved. Retrying."
            sleep $((attempt * 10))
          done
          if [ -z "$MERGED" ]; then
            echo "Could not merge PR #$NUMBER after 5 attempts."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Mark issue as merged
        if: success() && steps.changes.outputs.changed == 'true' && steps.landed.outputs.landed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          gh issue edit "$ISSUE" \
            --remove-label 'status: processing' \
            --remove-label 'status: pr-opened' \
            --add-label 'status: merged'
          gh issue comment "$ISSUE" --body "Merged: $PR_URL"
          gh issue close "$ISSUE" --reason completed || true

      # The merge above moved main, and Cloudflare's integration drops builds when pushes
      # land close together, which a batch of movie issues does by construction. That is
      # what verify-deploy.yml watches for, but it is `on: push` and the merge was made
      # with GITHUB_TOKEN, so it never hears about this push. Dispatch it by hand.
      #
      # Best effort: a missed check is worse than a failed issue, so this never fails the
      # run. verify-deploy's concurrency group is a single slot with cancel-in-progress,
      # so a batch collapses to one run watching the final state of main, which is the
      # right one to watch.
      - name: Ask verify-deploy to watch this push
        if: success() && steps.changes.outputs.changed == 'true' && steps.landed.outputs.landed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run verify-deploy.yml --ref main ||
            echo "verify-deploy dispatch failed; this push is not being watched."

      - name: Report failure on issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue edit "$ISSUE" \
            --remove-label 'status: processing' \
            --remove-label 'status: pr-opened' \
            --add-label 'status: failed' || true
          gh issue comment "$ISSUE" --body "Bot failed. See [run logs]($RUN_URL). Edit this issue to retry."
