name: Movie from issue

on:
  issues:
    types: [opened, edited, labeled]
  pull_request:
    types: [closed]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    if: >-
      github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name, 'type: movie') &&
      github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    concurrency:
      group: movie-from-issue-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mark issue as processing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE" \
            --remove-label 'status: queued' \
            --remove-label 'status: failed' \
            --add-label 'status: processing' || true

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build movie file from issue
        id: build
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/build-movie-from-issue.js

      - name: Validate (lint + test + build)
        run: |
          npm run lint
          npm test
          npm run build

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Commit and push branch
        id: commit
        env:
          SLUG: ${{ steps.build.outputs.slug }}
          TITLE: ${{ steps.build.outputs.title }}
          PATH_FILE: ${{ steps.build.outputs.path }}
        run: |
          BRANCH="bot/movie/$SLUG"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -B "$BRANCH"
          git add "$PATH_FILE"
          git commit -m "feat(movies): add $TITLE"
          git push --force-with-lease origin "$BRANCH"

      - name: Open or update PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          TITLE: ${{ steps.build.outputs.title }}
          LIST: ${{ steps.build.outputs.list }}
          PATH_FILE: ${{ steps.build.outputs.path }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          BODY=$(cat <<EOF
          Closes #${ISSUE}

          Generated by **movie-from-issue** from issue #${ISSUE}.

          - Title: ${TITLE}
          - List: ${LIST}
          - File: \`${PATH_FILE}\`
          EOF
          )
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$EXISTING" ]; then
            URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "feat(movies): add $TITLE" \
              --body "$BODY" \
              --label bot)
            NUMBER=$(basename "$URL")
            gh pr merge "$NUMBER" --auto --squash
          else
            URL=$(gh pr view "$EXISTING" --json url -q .url)
            gh pr edit "$EXISTING" --body "$BODY"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Mark issue as pr-opened
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          gh issue edit "$ISSUE" \
            --remove-label 'status: processing' \
            --add-label 'status: pr-opened'
          gh issue comment "$ISSUE" --body "PR opened: $PR_URL"

      - name: Report failure on issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue edit "$ISSUE" \
            --remove-label 'status: processing' \
            --remove-label 'status: pr-opened' \
            --add-label 'status: failed' || true
          gh issue comment "$ISSUE" --body "Bot failed. See [run logs]($RUN_URL). Edit this issue to retry."

  mark-merged:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'bot') &&
      startsWith(github.event.pull_request.head.ref, 'bot/movie/')
    runs-on: ubuntu-latest
    steps:
      - name: Mark linked issue as merged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          ISSUE=$(printf '%s\n' "$BODY" | grep -oE 'Closes #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          if [ -n "$ISSUE" ]; then
            gh issue edit "$ISSUE" \
              --remove-label 'status: pr-opened' \
              --remove-label 'status: processing' \
              --remove-label 'status: queued' \
              --add-label 'status: merged'
          fi
