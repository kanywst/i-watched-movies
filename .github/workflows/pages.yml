name: Deploy to GitHub Pages

# One push, one deploy. This replaced Cloudflare's GitHub integration on 2026-09-24, which
# dropped builds when pushes landed close together (a batch of movie issues does that by
# construction) and needed a watchdog workflow to notice.
#
# workflow_dispatch is not optional: movie-from-issue.yml merges with GITHUB_TOKEN, and a
# push made with that token starts no workflow run, so without the dispatch it sends at the
# end of each merge, entries filed through issues would never deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A single slot: a newer push supersedes a queued deploy, since the latest main is the only
# state worth publishing. In-progress deploys are not cancelled mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Pushes straight to main skip the PR run, so this is the last gate before the site.
      - name: Lint and test
        run: |
          npm run lint
          npm test

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
