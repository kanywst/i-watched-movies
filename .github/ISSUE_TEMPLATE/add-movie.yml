name: Add a movie
description: Log a watched movie or add to your watchlist. The bot will open a PR.
title: '[movie] '
labels:
  - 'type: movie'
  - 'status: queued'
  - bot
body:
  - type: input
    id: movie_title
    attributes:
      label: Title
      placeholder: e.g. 28 Years Later
    validations:
      required: true

  - type: dropdown
    id: list
    attributes:
      label: List
      description: 'Where to add this entry. Seen = watched but left unrated (its own section, no score). In Progress = started but not finished, e.g. a long series.'
      options:
        - Watched
        - In Progress
        - Watchlist
        - Seen
      default: 0
    validations:
      required: true

  - type: input
    id: slug
    attributes:
      label: Slug
      description: 'Optional. Filename for movies/<slug>.md. Set this for a Japanese title, which otherwise falls back to movie-<issue number>.'
      placeholder: shikei-ni-itaru-yamai

  - type: input
    id: watch_date
    attributes:
      label: Watch date
      description: 'YYYY-MM-DD (leave blank for watchlist)'
      placeholder: '2026-05-10'

  - type: input
    id: point
    attributes:
      label: Point
      description: 'Score 0-10, half-point steps (e.g. 8.5)'
      placeholder: '8.5'

  - type: input
    id: release_date
    attributes:
      label: Release date
      description: 'YYYY-MM-DD'
      placeholder: '2025-06-20'

  - type: dropdown
    id: national
    attributes:
      label: National
      description: Optional. Must match a key in COUNTRY_FLAGS (src/constants.ts) to render a flag.
      options:
        - Japan
        - USA
        - UK
        - France
        - Korea
        - China
        - Hong Kong
        - Taiwan
        - India
        - Thailand
        - Indonesia
        - Philippines
        - Vietnam
        - Germany
        - Austria
        - Spain
        - Italy
        - Ireland
        - Netherlands
        - Belgium
        - Sweden
        - Norway
        - Denmark
        - Finland
        - Iceland
        - Poland
        - Turkey
        - Iran
        - Israel
        - Canada
        - Mexico
        - Brazil
        - Argentina
        - Chile
        - Australia
        - New Zealand

  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated
      placeholder: Horror, Sci-fi

  - type: checkboxes
    id: streaming
    attributes:
      label: Streaming
      description: 'Watchlist only. Tick the JP subscription services it is available on (leave all unticked otherwise). Options are the exact keys in STREAMING_SERVICES (src/constants.ts).'
      options:
        - label: Netflix
        - label: Disney+
        - label: Prime Video
        - label: U-NEXT
        - label: Hulu

  - type: input
    id: checked
    attributes:
      label: Availability checked
      description: 'YYYY-MM. When streaming availability was last verified (shown next to the badges).'
      placeholder: '2026-07'

  - type: input
    id: cover_image
    attributes:
      label: Cover image URL
      placeholder: https://...

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Optional one-liner

  - type: textarea
    id: impression
    attributes:
      label: Impression
      description: Optional personal take

  - type: textarea
    id: notes
    attributes:
      label: Body
      description: Plot or notes. Becomes the markdown body of movies/<slug>.md.
